# Umami — self-hosted web analytics for the AutoMarkIQ landing.
# Deploy on the VPS:  cd /opt/umami && docker compose up -d
# Then reverse-proxy analytics.automarkiq.com -> localhost:3002 (Nginx + Certbot),
# create a website in the Umami panel, and set UMAMI_SRC / UMAMI_WEBSITE_ID on the
# crm web container (see deploy/umami/README below).

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    ports:
      - "3002:3000"          # host:container — Nginx proxies to 3002
    environment:
      DATABASE_URL: postgresql://umami:CHANGE_DB_PASSWORD@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: CHANGE_ME_TO_A_LONG_RANDOM_STRING
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: CHANGE_DB_PASSWORD
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  umami-db-data:
